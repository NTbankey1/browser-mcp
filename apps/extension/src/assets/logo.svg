    </linearGradient>
    <filter id="shadow" x="16" y="26" width="96" height="86" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1E1B4B" flood-opacity="0.32"/>

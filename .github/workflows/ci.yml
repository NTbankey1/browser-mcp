name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: go test -short ./...
        working-directory: go
      - run: go build ./...
        working-directory: go

  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Installs the pnpm version in `packageManager` and the Node version in `devEngines.runtime`, then runs `pnpm install --frozen-lockfile`
      - name: Set up pnpm and Node
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - run: pnpm lint
      - run: pnpm format
      - run: pnpm typecheck

      # Ubuntu 24.04 runners block the unprivileged user namespaces Chromium's sandbox needs
      - name: Allow Chromium's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The server's tests run Playwright's Chromium
      - name: Install Chromium
        run: pnpm --filter @browsermcp/mcp exec playwright-core install --with-deps chromium

      - run: pnpm test
      - run: pnpm build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build the Go front door
        run: pnpm --filter @browsermcp/mcp go:build

      - name: Go tests (race detector)
        run: go test -race ./...
        working-directory: go

      - name: Cross-compile the Go front door
        run: |
          for target in darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 linux/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -o "/tmp/browsermcpd-${target%/*}-${target#*/}" ./cmd/browsermcpd
          done
        working-directory: go

      # Drives the built extension through the server in headless Chromium
      - name: Smoke test
        run: pnpm smoke
